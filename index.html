<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/prospy.png" />
    <link rel="preload" href="/prospy.png" as="image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Prospy — Trouvez les commerces sans site web</title>
    <meta
      name="description"
      content="Prospy parcourt Google Maps, isole les entreprises locales sans vrai site web, et les range dans un pipeline d’appels jusqu’à la signature."
    />
    <meta property="og:title" content="Prospy — Trouvez les commerces sans site web" />
    <meta
      property="og:description"
      content="Relevé local, pipeline d’appels, carte et export. Les paiements passent par Stripe."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wegeo.theme');
          var dark = stored ? stored === 'nuit' || stored === 'sombre' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
