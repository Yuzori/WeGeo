<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/model-optimized.glb" as="fetch" crossorigin />
    <link rel="preload" href="/draco/draco_wasm_wrapper.js" as="script" />
    <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Prospy. Le meilleur outil de prospection au monde</title>
    <meta
      name="description"
      content="Le meilleur outil de prospection au monde. Prospy ouvre les fiches Google Maps, écarte les commerces qui ont déjà un site, et vous rend une liste d’appels classée."
    />
    <meta property="og:title" content="Prospy. Le meilleur outil de prospection au monde" />
    <meta
      property="og:description"
      content="Le meilleur relevé local, pipeline d’appels, carte et export. Les paiements passent par Stripe."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html.is-boot .lp-hero-copy .lp-chip,
      html.is-boot .lp-hero-title .lp-glyph,
      html.is-boot .lp-hero-lead,
      html.is-boot .lp-hero-ctas,
      html.is-boot .lp-proof,
      html.is-boot .lp-hero-mocks,
      html.is-boot .lp-hero-stage .lp-radar {
        opacity: 0;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wegeo.theme');
          var dark = stored ? stored === 'nuit' || stored === 'sombre' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          var lang = localStorage.getItem('prospy.lang');
          if (lang !== 'en' && lang !== 'fr') {
            var tags = [navigator.language].concat(navigator.languages || []);
            lang = 'fr';
            for (var i = 0; i < tags.length; i++) {
              var tag = String(tags[i] || '').toLowerCase();
              if (tag === 'fr' || tag.indexOf('fr-') === 0) { lang = 'fr'; break; }
              if (tag === 'en' || tag.indexOf('en-') === 0) { lang = 'en'; break; }
            }
          }
          document.documentElement.lang = lang;
          var path = location.pathname.replace(/\/+$/, '') || '/';
          if (path === '/' && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('is-boot');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
